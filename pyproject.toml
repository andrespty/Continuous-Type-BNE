[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-bayesian-ne"
version = "0.1.0"
description = "Continuous Bayesian Nash equilibrium experiments in Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "tensorflow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
